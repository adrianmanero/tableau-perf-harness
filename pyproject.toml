[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tableau-perf-harness"
version = "1.0.0"
description = "Repeatable interaction benchmarks for published Tableau views."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40",
    "PyYAML>=6",
]

[project.scripts]
tableau-perf = "tableau_perf.cli:main"

[tool.setuptools.packages.find]
include = ["tableau_perf*"]

[tool.setuptools.package-data]
tableau_perf = ["runner.html"]
